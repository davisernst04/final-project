version: '3.8'

services:
  database:
    image: mysql:8.0
    command: 
      - --innodb_ft_min_token_size=3
      - --innodb_ft_enable_stopword=0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: project
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-padmin"]
      interval: 5s
      timeout: 10s
      retries: 5

  server:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=admin
      - DB_DATABASE=project
      - DB_PORT=3306
      - JWT_SECRET=your_jwt_secret_key_here
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  client:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - server

volumes:
  mysql_data:

