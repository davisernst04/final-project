services:
  mysql1:
    image: mysql:8.0
    container_name: db1
    ports:
      - "3306:3306" 
    environment:  
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","-u", "root", "-padmin"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s  
  node1:
    build: ./backend
    container_name: nodejs1
    ports:
      - "8080:8080"   
    volumes:
      - ./backend:/code
    environment:
      DB_HOST: mysql1
      DB_USER: root
      DB_PASSWORD: admin
      DB_PORT: 3306
      DB_DATABASE: db2  
    depends_on:
      mysql1:
         condition: service_healthy
  web:
    build: ./frontend
    container_name: react1
    ports:
     - "3000:3000"
    volumes:
     - ./frontend:/react-app
    stdin_open: true
    tty: true 
    command: ["npm", "start"]

volumes:
  mysql_data:
