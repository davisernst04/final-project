services:
  database:
    image: mysql:8.0
    container_name: mysql 
    ports:
      - "3306:3306" 
    environment:  
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: project
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","-u", "root", "-padmin"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s  
  server:
    build: ./backend
    container_name: nodejs
    ports:
      - "8080:8080"   
    volumes:
      - ./backend:/code
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: admin
      DB_PORT: 3306
      DB_DATABASE: project
    depends_on:
      database:
         condition: service_healthy
  client:
    build: ./frontend
    container_name: react
    ports:
     - "3000:3000"
    volumes:
     - ./frontend:/react-app
    stdin_open: true
    tty: true 
    command: ["npm", "start"]

volumes:
  mysql_data:
